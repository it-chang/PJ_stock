                    </v-col>

                                //將上面再拆出 : 前八季都有賠錢的
                                stockSet1 = new Set(['2025','6679','1802','6770','2032','2030','6834','2035','2103','6506','6505','6431','6265','2337','1785','3081','6844','1586','1303','9929','8935','8489','8473','8423','1313','1326','1447','8131','1776','8105','8096','8046','8044','8040','2344','1727','1762','7610','6209','2399','6195','2351','4764','4711','4569','4502','4426','4147','3691','3685','3632','3623','2908','3555','3550','3522','3508','3006','3372','3048','3224','3054','3135','2486','4807','2485','5351','6154','6150','6016','6015','3122','2406','2408','5475','5468','2440','4923','5228','4991','4989','4973','4971','4967','4956','4949','4939','9944']);

                                app.jsonData = app.jsonData.filter(x =>
                                    stockSet.has(x.stock_number)
                                    //&& (['半導體業','電腦及週邊設備業','電子零組件業','光電業','電機機械','通信網路業'].includes(x.Type1))

                                app.sortDesc = [ true,false]

                        ">收益佳</v-btn>

                        <v-btn color="primary" @click="   

                                stockSet = new Set(['2330', '2383', '2454', '2327', '2345', '6223', '2308', '3017', '6669', '3037', '3665', '2368', '3711', '2303', '8046', '3653', '5274', '6274', '6515', '6510', '8210', '6805', '3533', '2317', '2404', '6187', '6147', '8996', '5439', '3443', '8150', '4966', '2449', '6278', '4958', '1590', '8358', '6191', '3376', '6271', '2002', '2313', '1319', '1815', '2439', '2382', '3661', '3264', '2481', '3008', '5347']);

                                );

                                app.sortBy = ['MACD_last_cross_date','BB_golden_cross_area','MACD-SL']
                                app.sortDesc = [true, true,false]
                                app.sortBy = ['BB_last_cross_date','MACD-SL']
                                app.sortDesc = [ true,false]

                        ">00981A</v-btn>

                         <v-btn color="primary" @click="     
                             app.jsonData = app.jsonData_.filter( x =>true
                                && x['現價年線比']<1.3
                                && x['現價年線比'] >= 0.97

                                && parseFloat(x['MACD']) > parseFloat(x['MACD-SL'])
                                && parseFloat(x['MACD_hist_diff']) >0

                                && parseFloat(x['長交易量']) < 0.8
                                && parseFloat(x['短交易量']) > 1.2

                                && parseFloat(x['High_15d']) == parseFloat(x['High_90d'])
                                && parseFloat(x['Low_15d']) > parseFloat(x['Low_90d'])
                            )
                        ">低檔過年線起量</v-btn>

                    </v-col>
                </v-row>
                <!-- Vuetify DataTable  -->
                <v-data-table disable-pagination fixed-header height="90vh" hide-default-footer :headers="appheaderData"
                    v-show="appmode" :items="appfilteredData" :items-per-page="-1" item-key="id" :sort-by.sync="sortBy"
                    :sort-desc.sync="sortDesc" :mobile-breakpoint="0" style="white-space: nowrap;">
                    <template v-slot:item.stock_number="{ item }">
                        <v-btn text @click="openDialog(item)">
                            {{ item.stock_number }} {{ item.Type0 }}
                        </v-btn>
                    </template>
                    <template v-slot:item.rt_price="{ item }">
                        <span style="color: rgb(124, 169, 173);"
                            v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.a">
                            {{(((realtimedata.filter(x=>x.c==item.stock_number)[0]?.a / item.now_price)-1
                            )*100).toFixed(1)}}
                        </span>
                    </template>
                    <template v-slot:item.rt_量="{ item }">
                        <span style="color: rgb(124, 169, 173);"
                            v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.a">
                            {{(realtimedata.filter(x=>x.c==item.stock_number)[0]?.v/parseFloat(item.成交股數)).toFixed(1)}}
                        </span>
                    </template>
                </v-data-table>

                <v-data-table disable-pagination fixed-header height="95vh" hide-default-footer :headers="headers"
                    :items="filteredData" v-show="!appmode" :items-per-page="-1" item-key="id" :sort-by.sync="sortBy"
                    :sort-desc.sync="sortDesc" style="white-space: nowrap;">
                    <template v-slot:item.stock_number="{ item }">
                        <div
                            :class="{ 'highlight-red':
                                            Number(item['MA_20_斜率']) > 0 &&
                                            Number(item['量短5長30比']) > 0
                                        }"
                            >
                            <v-icon
                                v-if="checklist.filter(x => x == item.stock_number).length > 0"
                                color="orange"
                            >
                                mdi-star
                            </v-icon>

                            <v-btn text @click="openDialog(item)">
                                {{ item.stock_number }}
                                {{ item.Type0 }}
                                {{ item['Volume_%'] }}
                            </v-btn>
                        </div>
                    </template>
                     <template v-slot:item.價="{ item }">
                            <!-- 🔴 最強：MA5、MA10、MA20 三線同步向上 -->
                            <template v-if="Number(item['MA_5_斜率']) > 0.001 
                                            && Number(item['MA_10_斜率']) > 0.001 
                                            && Number(item['MA_20_斜率']) > 0.001">
                                <v-icon color="red">mdi-arrow-up-bold-circle</v-icon>
                                <span style="color:red; font-size:12px;">三線同揚</span>
                            </template>

                            <!-- 🟠 中等：MA5、MA10 向上（MA20未確認） -->
                            <template v-else-if="Number(item['MA_5_斜率']) > 0.001 
                                                && Number(item['MA_10_斜率']) > 0.001">
                                <v-icon color="orange">mdi-arrow-up-bold-circle</v-icon>
                                <span style="color:orange; font-size:12px;">短中線向上</span>
                            </template>

                            <!-- 🟣 中弱：MACD柱放大 且 KD黃金交叉（%K>%D）且 %K>30 -->
                            <template v-else-if="Number(item['MACD_hist_diff']) > 0 
                                                && Number(item['%K']) > 30 
                                                && Number(item['%K']) > Number(item['%D'])">
                                <v-icon color="#523bffb3">mdi-arrow-up-bold-circle</v-icon>
                                <span style="color:#523bffb3; font-size:12px;">KD交叉向上</span>
                            </template>

                            <!-- 🔵 弱（A）：MACD 上穿訊號線 -->
                            <template v-else-if="Number(item['MACD']) > Number(item['MACD-SL'])">
                                <v-icon color="#1565C0">mdi-arrow-up-bold</v-icon>
                                <span style="color:#1565C0; font-size:12px;">MACD穿訊號線</span>
                            </template>

                            <!-- 💠 最弱（B）：MACD柱放大 且 %K>30（無KD交叉） -->
                            <template v-else-if="Number(item['MACD_hist_diff']) > 0 
                                                && Number(item['%K']) > 30">
                                <v-icon color="#90CAF9">mdi-arrow-up-bold</v-icon>
                                <span style="color:#90CAF9; font-size:12px;">MACD動能增強</span>
                            </template>
                            
                    </template>
                    <template v-slot:item.量="{ item }">
                          
                        <!-- 🔴 最強：MA5>MA10*1.1 且 量短5長30比 超過歷史平均水準 -->
                        <template v-if="Number(item['Volume_MA_5']) > Number(item['Volume_MA_10']) * 1.1
                                        && Number(item['量短5長30比']) >= 1
                                        && Number(item['成交金額']) > Number(item['成交金額平均']) * 1.2">
                            <v-icon color="red">mdi-arrow-up-bold-circle</v-icon>
                            <span style="color:red; font-size:12px;">量能全面擴張</span>
                        </template>

                        <!-- 🟠 中等：MA5>MA10 -->
                        <template v-else-if="Number(item['Volume_MA_5']) > Number(item['Volume_MA_10'])">
                            <v-icon color="orange">mdi-arrow-up-bold-circle</v-icon>
                            <span style="color:orange; font-size:12px;">短期量能擴張</span>
                        </template>

                        <!-- 🔵 最弱：今日量 > MA5*1.3 -->
                        <template v-else-if="Number(item['成交金額']) > Number(item['Volume_MA_5']) * 1.5">
                            <v-icon color="blue">mdi-arrow-up-bold-circle</v-icon>
                            <span style="color:blue; font-size:12px;">單日突發爆量</span>
                        </template>
                     
                    </template>
                    
                    <template v-slot:item.stock_name="{ item }">
                        <v-btn text @click="openDialog(item)">
                            {{ item.stock_number }} {{ item.Type0 }} {{item['Volume_%']}}
                        </v-btn>
                    </template>

                    <template v-slot:item.now_price="{ item }">
                        <v-btn text @click="openDialog(item)">
                            <span style="color: rgb(124, 169, 173);"
                                v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.g">
                                {{realtimedata.filter(x=>x.c==item.stock_number)[0]?.g}} |
                                {{realtimedata.filter(x=>x.c==item.stock_number)[0]?.b}}
                            </span>
                            {{ item.now_price }}
                            <span style="color: rgb(124, 169, 173);"
                                v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.g">
                                {{realtimedata.filter(x=>x.c==item.stock_number)[0]?.a}}|
                                {{realtimedata.filter(x=>x.c==item.stock_number)[0]?.f}}
                            </span>
                        </v-btn>
                    </template>

                    <template v-slot:item.rt_price="{ item }">
                        <span style="color: rgb(124, 169, 173);"
                            v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.a">
                            {{(((realtimedata.filter(x=>x.c==item.stock_number)[0]?.a / item.now_price)-1
                            )*100).toFixed(1)}}
                        </span>
                    </template>
                    <template v-slot:item.rt_量="{ item }">
                        <span style="color: rgb(124, 169, 173);"
                            v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.a">
                            {{(realtimedata.filter(x=>x.c==item.stock_number)[0]?.v/parseFloat(item.成交股數)).toFixed(1)}}
                        </span>
                    </template>

                    <template v-slot:item.成交股數="{ item }">
                        <v-btn text @click="openDialog(item)">
                            {{ item.成交股數 }} <span style="color: rgb(124, 169, 173);"
                                v-show="realtimedata.filter(x=>x.c==item.stock_number)[0]?.g">
                                ({{realtimedata.filter(x=>x.c==item.stock_number)[0]?.v}})</span>
                        </v-btn>
                    </template>
                </v-data-table>
                <stock-dialog :value="dialog" :item="selectedItem" :checklist="checklist" :url="url" @input="dialog = $event"
                    @update-check="handleCheckUpdate" />
            </v-container>
        </v-app>
    </div>

    <script>
        var app = new Vue({
            el: '#app',
            vuetify: new Vuetify(),
            data() {
                return {
                    checked: false,
                    checklist: [],
                    appmode: false,
                    sync: false,
                    url: '',
                    jsonData: [],
                    headers: [],
                    appheaderscol: ['stock_number', '_quote', 'rt_price', 'rt_量', 'highlight_date', '遠交易量o'],
                    filters: {},
                    uniqueValues: {},
                    sortBy: '短交易量',
                    sortDesc: true,
                    dialog: false,
                    selectedItem: null,
                    realtimedata: [],
                    paraDate: null,
                };
            },
            created() {
                this.url = window.location.href.split('/').slice(0, 4).join('/') + '/Html/'
                if (window.location.host.indexOf("it-chang") !== -1) {
                    this.url = this.url.replace('PJ_stock/Html', 'PJ_Stock2')
                };
                let urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('mode')) {
                    // &mode=app 
                    this.appmode = urlParams.get('mode') == 'app';
                }
                if (urlParams.has('sync')) {
                    this.sync = urlParams.get('sync') == 'Y';
                }

                this.init();
                this.checklist = JSON.parse(localStorage.getItem('checklist') || '[]')

                                        flag += 2  // 🔵 MACD穿訊號線
                                    } else if (hist_diff > 0 && k > 30) {
                                        flag += 1  // 💠 MACD動能增強
                                    }

                                    item['綜合Flag'] = isNaN(flag) ? null : flag
                                })



                                this.jsonData.map(item => item.MA擴大 = (parseFloat(item['MA_20']) / parseFloat(item['MA_80'])).toFixed(2))


                                // 解析 text_desc 的 LV 編號
                                this.jsonData.map(item => {
                                    const m = (item['text_desc'] || '').match(/LV\.(\d+)-(\d+)/);
                                    item['_lv_major'] = m ? parseInt(m[1]) : 999;
                                    item['_lv_minor'] = m ? parseInt(m[2]) : 999;
                                });


                                //成交金額50日均 vs 總體成交金額平均 比較 (長交易量)
                                this.jsonData.map(item => item.長交易量 = (parseFloat(item['Volume_MA_50']) / parseFloat(item['成交金額平均'])).toFixed(2))
                                //當日成交金額 vs 5日均 比較 (短交易量)
                                this.jsonData.map(item => item.短交易量 = (parseFloat(item['成交金額']) / parseFloat(item['Volume_MA_5'])).toFixed(2))



                                ///////////////////////////////////////////////////////////////////
                                if (!!this.paraDate) {
                                    this.jsonData.filter(item => item['MACD_last_cross_date'] > this.paraDate_str()).map(x => x.MACD_last_cross_date = '')
                                    this.jsonData.filter(item => item['MA_last_cross_date'] > this.paraDate_str()).map(x => x.MA_last_cross_date = '')
                                    //this.jsonData.filter(item => item['voc_cross_d'] > this.paraDate_str().replaceAll('/', '-')).map(x => x.voc_cross_d = '')
                                }
                                //# -- 
                                this.jsonData.map(x => x.營業毛利率 = x.營業毛利率.replace('%', ''))
                                this.jsonData.map(x => x.營業利益率 = x.營業利益率.replace('%', ''))
                                this.jsonData.map(x => x['每股營收(元)'] = parseFloat(x['每股營收(元)'].replace(',', '')))

                                //#  另外處理資料-- 
                                this.jsonData.filter(item => parseFloat(item['MACD']) < parseFloat(item['MACD-SL'])).map(x => x.MACD_last_cross_date = '')
                                this.jsonData.filter(item => parseFloat(item['均價long_%']) < 0).map(x => x.MA_last_cross_date = '')
                                this.jsonData_ = JSON.parse(JSON.stringify(this.jsonData))

                                // 過濾Type
                                if (this.type) {
                                    //this.jsonData = this.jsonData_.filter(x => x.Typelevel.includes(this.type) || x.desc.includes(this.type) | x.text_desc.includes(this.type));
                                    debugger;
                                    this.type.split('_')
                                    t1=this.type.split('_')[0]
                                    t2=this.type.split('_')[1]
                                    if(!!t1){
                                        this.jsonData = this.jsonData_.filter(x =>x.text_desc.includes(t1) );
                                    }
                                    if(!!t2){
                                        this.jsonData = this.jsonData.filter(x =>x.text_desc.includes(t2) );
                                    }
                                    
                                }

                                Object.keys(this.uniqueValues).forEach(key => {
                                    this.uniqueValues[key] = this.uniqueValues[key].map(val => ({ text: val, value: val }));
                                    this.uniqueValues[key].sort((a, b) => a.text.localeCompare(b.text));
                                });
                            }

                            //app.sortBy = ['MACD_last_cross_date','Type1','LevelArea']
                            app.sortBy = ['MACD_last_cross_date','GM_QoQ_%']
                            app.sortDesc = [true, true]
                        })
                        .catch(error => console.error('Error loading Excel file:', error));
                },

                reverse(x) {
                    var vm = this
                    vm.jsonData = vm.jsonData_.filter(i => !vm.jsonData.map(x => x.stock_number).includes(i.stock_number))
                },
                dataCache() {
                    //app.jsonData=app.jsonData_.filter(x=>parseFloat(x.now_price)>parseFloat(x.highlight_enddate收盤價_1)&& parseFloat(x.now_price)>parseFloat(x.highlight_enddate收盤價_2)&&parseFloat(x.now_price)>parseFloat(x.highlight_stardate收盤價_2) &&parseFloat(x.now_price)>parseFloat(x.highlight_stardate收盤價_1)  &&x.highlight_stardate收盤價_1!=0 &&x.Type2!='上櫃' && x.highlight_date!='0')
                    app.sortBy = 'highlight_%'
                    return app.jsonData.sort(function (a, b) { return b['highlight_%'] - a['highlight_%']; })
                        .map((str, idx) => ({
                            key: idx + 1,   // 根據排序結果給 key (從 1 開始)
                            value: str.stock_number
                        }));
                },

                setCache() {
                    var vm = this
                    localStorage.setItem('cache', JSON.stringify(vm.dataCache()));
                    var cache = JSON.parse(localStorage.getItem('cache') || '[]')
                    app.jsonData.map(y => y.分類標籤 = (cache.find(x => x.value == y.stock_number)?.key + y.分類標籤))

                },
                getCache() {
                    var vm = this
                    localStorage.setItem('cachenew', JSON.stringify(vm.dataCache()));
                    var cachenew = JSON.parse(localStorage.getItem('cachenew') || '[]')
                    app.jsonData.map(y => y.分類標籤 = (cachenew.find(x => x.value == y.stock_number)?.key + y.分類標籤))

                    var cache = JSON.parse(localStorage.getItem('cache') || '[]')
                    app.jsonData.map(y => y.分類標籤 = (cache.find(x => x.value == y.stock_number)?.key + '->' + y.分類標籤))

                    app.jsonData.map(y => y.分類標籤 = (cachenew.find(x => x.value == y.stock_number)?.key < cache.find(x => x.value == y.stock_number)?.key ? 'T' : '') + '   ' + y.分類標籤)

                    /**/
                    var cache = JSON.parse(localStorage.getItem('cache') || '[]')
                    var cachenew = JSON.parse(localStorage.getItem('cachenew') || '[]')
                    //app.jsonData = app.jsonData.filter(y => (cachenew.find(x => x.value == y.stock_number)?.key < cache.find(x => x.value == y.stock_number)?.key))
                    app.jsonData.map(y => y.分類標籤 = (-cachenew.find(x => x.value == y.stock_number)?.key + cache.find(x => x.value == y.stock_number)?.key))

                },
                setCache2() {
                    localStorage.setItem('cache2', JSON.stringify(
                        app.jsonData_.filter(item => true
                            //&&  parseFloat( item['Volume_MA_5'])> parseFloat(item['Volume_MA_1050']*1.05) 
                            && parseFloat(item['Volume_MA_5']) > parseFloat(item['Volume_MA_10'])
                            && parseFloat(item['Volume_MA_50']) > parseFloat(item['成交金額平均']) * 0.8
                            && parseFloat(item['MACD']) > parseFloat(item['MACD-SL'])
                            && parseFloat(item['now_price']) > parseFloat(item['MA_50'] * 1.05)
                            && parseFloat(item['成交股數']) > 1000
                        ).map(x => x.stock_number)
                    ))
                    app.jsonData = app.jsonData_.filter(item => true
                        //&&  parseFloat( item['Volume_MA_5'])> parseFloat(item['Volume_MA_1050']*1.05) 
                        && parseFloat(item['Volume_MA_5']) > parseFloat(item['Volume_MA_10'])
                        && parseFloat(item['Volume_MA_50']) > parseFloat(item['成交金額平均']) * 0.8
                        && parseFloat(item['MACD']) > parseFloat(item['MACD-SL'])
                        && parseFloat(item['now_price']) > parseFloat(item['MA_50'] * 1.05)
                        && parseFloat(item['成交股數']) > 1000
                    )

                },
                getCache2() {
                    var a = JSON.parse(localStorage.getItem('cache2') || '[]')
                    var b = app.jsonData_.filter(item => true
                        //&&  parseFloat( item['Volume_MA_5'])> parseFloat(item['Volume_MA_1050']*1.05) 
                        && parseFloat(item['Volume_MA_5']) > parseFloat(item['Volume_MA_10'])
                        && parseFloat(item['Volume_MA_50']) > parseFloat(item['成交金額平均']) * 0.8
                        && parseFloat(item['MACD']) > parseFloat(item['MACD-SL'])
                        && parseFloat(item['now_price']) > parseFloat(item['MA_50'] * 1.05)
                        && parseFloat(item['成交股數']) > 1000
                    ).map(x => x.stock_number)
                    app.jsonData = app.jsonData_.filter(x => b.filter(item => !a.includes(item)).includes(x.stock_number))

                },
                filter_test() {
                    var vm = this;
                    var alist =

                        app.jsonData_.map(x => ({
                            stock_number: x.stock_number,
                            stock_name: x.Type,
                            Ongoing: x.highlight_date != '0',
                            Check: (x.highlight_date != 0 ? parseFloat(x.now_price) : parseFloat(x.highlight_stardate收盤價_1)) > parseFloat(x.highlight_enddate收盤價_2),
                            Period: 1,
                            "date Start": x.highlight_stardate_1,
                            date_End: x.highlight_enddate_1,
                            "price Start": x.highlight_stardate收盤價_1,
                            price_End: x.highlight_date != 0 ? x.now_price : x.highlight_enddate收盤價_1,
                            u_gain: (parseFloat(((x.highlight_date != 0 ? x.now_price : x.highlight_enddate收盤價_1) - x.highlight_stardate收盤價_1) / x.highlight_stardate收盤價_1) * 100).toFixed(1),
                            u_gaind: ((Math.abs(new Date(x.highlight_enddate_1) - new Date(x.highlight_stardate_1))) / (1000 * 60 * 60 * 24))
                        })
                        ).concat(
                            app.jsonData_.map(x => ({
                                stock_number: x.stock_number,
                                stock_name: x.Type,
                                Ongoing: x.highlight_date != '0',
                                Period: 2,
                                "date Start": x.highlight_stardate_2,
                                date_End: x.highlight_enddate_2,
                                "price Start": x.highlight_stardate收盤價_2,
                                price_End: x.highlight_enddate收盤價_2,
                                u_gain: ((parseFloat(x.highlight_enddate收盤價_2 - x.highlight_stardate收盤價_2) / x.highlight_stardate收盤價_2) * 100).toFixed(1),
                                u_gaind: ((Math.abs(new Date(x.highlight_enddate_2) - new Date(x.highlight_stardate_2))) / (1000 * 60 * 60 * 24))
                            }))
                        )
                            .filter(x => x.Check && x.Ongoing && x.u_gain > 1 && x.u_gaind > 10)
                            .map(x => x.stock_number)

                },
                calculate(desc) {
                    const total = app.jsonData.length
                    const col = 'diff_quote' // '_quote'

                    const data = [
                        { desc: col + ': >5 	', count: (app.jsonData.filter(x => parseFloat(x[col]) > 5).length / total * 100).toFixed(2) + '%' },
                        { desc: col + ': >1 	', count: (app.jsonData.filter(x => parseFloat(x[col]) > 1).length / total * 100).toFixed(2) + '%' },
                        { desc: col + ': <-2	', count: (app.jsonData.filter(x => parseFloat(x[col]) < -2).length / total * 100).toFixed(2) + '%' },
                    ];

                    app.jsonData_.filter(x => app.jsonData.map(y => y.stock_number).includes(x.stock_number)).map(x => x.tempdesc += desc + ' ')

                    console.table(data)
                },
                set_tempdesc() {

                    const total = app.jsonData.length
                    const col = 'diff_quote' // '_quote'

                    const data = [
                        { desc: '5', count: (app.jsonData.filter(x => parseFloat(x[col]) > 5).length / total * 100).toFixed(2) + '%' },
                        { desc: '0', count: (app.jsonData.filter(x => parseFloat(x[col]) > 0).length / total * 100).toFixed(2) + '%' },
                        { desc: '-0', count: (app.jsonData.filter(x => parseFloat(x[col]) <= -0).length / total * 100).toFixed(2) + '%' },
                        { desc: '-5', count: (app.jsonData.filter(x => parseFloat(x[col]) <= -5).length / total * 100).toFixed(2) + '%' },
                        { desc: 'all', count: app.jsonData.length },
                    ];


                    // 【數值型】

                    // 【分類型】

                    const setPara = [...new Set(app.jsonData.map(x => x.分類標籤))].sort()
                    const setTarget = '分類標籤'
                    //[90, 60,0,-1]
                    //const setPara= [...new Set(app.jsonData.map(x=>x.LevelArea))].sort((a, b) => a - b)
                    //const setTarget= 'LevelArea'
                    //const setPara= [...new Set(app.jsonData.map(x=>x.多頭排列_前5日次數))].sort((a, b) => a - b)
                    //const setTarget= '多頭排列_前5日次數'

                    setPara.forEach(tag => {
                        data.forEach(d => {
                            _total = app.jsonData.filter(x => x[setTarget] == tag).length
                            if (d.desc == 'all') {
                                d['_' + tag] = _total
                            } else {
                                if (!d.desc.includes('-')) {
                                    d['_' + tag] = (app.jsonData.filter(x => parseFloat(x[col]) > parseFloat(d.desc) && x[setTarget] == tag).length / _total * 100).toFixed(2) + '%'
                                    //d['_'+tag]=  app.jsonData.filter(x => parseFloat(x[col]) > parseFloat(d.desc)  && x[setTarget]==tag).length 
                                } else {
                                    d['_' + tag] = (app.jsonData.filter(x => parseFloat(x[col]) <= parseFloat(d.desc) && x[setTarget] == tag).length / _total * 100).toFixed(2) + '%'
                                    //d['_'+tag]=  app.jsonData.filter(x => parseFloat(x[col]) <= parseFloat(d.desc)  && x[setTarget]==tag).length 
                                }
                            }
                        })
                    })
                    console.table(data)

                },
            }
        });
